<style>
/* Layout: panel de widgets. Barra lateral de apps a la izquierda, barra superior (tema, asistente, avisos, perfil),
   y una cuadrícula: calendario + asistente arriba; pendientes, Drive y web debajo. Oscuro por defecto con brillo naranja. */
:root{
  --bg:#0C0806; --glow:rgba(255,92,22,.42); --glow2:rgba(255,140,60,.16);
  --card:#17110E; --card-hi:#1F1713; --sub:rgba(255,236,222,.045); --line:rgba(255,236,222,.08); --line2:rgba(255,236,222,.14);
  --ink:#F7EFE9; --muted:#A3958B; --faint:#6F635B;
  --accent:#FF6A26; --accent2:#FF9A45; --accent-ink:#1C0C04; --accent-soft:rgba(255,106,38,.14);
  --ok:#4CC38F; --ok-soft:rgba(76,195,143,.14); --bad:#FF6259; --bad-soft:rgba(255,98,89,.14); --info:#7DB4FF; --info-soft:rgba(125,180,255,.14);
  --shadow:0 18px 40px -24px rgba(0,0,0,.8);
  --ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:22px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1EBE6; --glow:rgba(255,106,38,.30); --glow2:rgba(255,160,90,.20);
  --card:#FFFFFF; --card-hi:#FBF8F6; --sub:rgba(60,30,10,.045); --line:rgba(60,30,10,.09); --line2:rgba(60,30,10,.16);
  --ink:#1E140E; --muted:#76675D; --faint:#A39389;
  --accent:#F05A16; --accent2:#FF8A3D; --accent-ink:#FFFFFF; --accent-soft:rgba(240,90,22,.11);
  --ok:#23915F; --ok-soft:rgba(35,145,95,.12); --bad:#D63C33; --bad-soft:rgba(214,60,51,.1); --info:#2F6FD1; --info-soft:rgba(47,111,209,.1);
  --shadow:0 18px 40px -26px rgba(80,40,10,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F1EBE6; --glow:rgba(255,106,38,.30); --glow2:rgba(255,160,90,.20);
  --card:#FFFFFF; --card-hi:#FBF8F6; --sub:rgba(60,30,10,.045); --line:rgba(60,30,10,.09); --line2:rgba(60,30,10,.16);
  --ink:#1E140E; --muted:#76675D; --faint:#A39389;
  --accent:#F05A16; --accent2:#FF8A3D; --accent-ink:#FFFFFF; --accent-soft:rgba(240,90,22,.11);
  --ok:#23915F; --ok-soft:rgba(35,145,95,.12); --bad:#D63C33; --bad-soft:rgba(214,60,51,.1); --info:#2F6FD1; --info-soft:rgba(47,111,209,.1);
  --shadow:0 18px 40px -26px rgba(80,40,10,.35); color-scheme:light}
/* la pantalla del asistente es siempre oscura: es un holograma */
:root{--hud-bg:#0B0705; --hud-bg2:#24120A; --hud-ink:#FFE9DC; --hud-dim:rgba(255,160,110,.55); --hud-line:rgba(255,122,48,.22); --hud-acc:#FF7A30}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--ui);font-size:15px;line-height:1.45;color:var(--ink);
  background:radial-gradient(60% 45% at 0% 0%,var(--glow),transparent 70%),radial-gradient(45% 35% at 100% 0%,var(--glow2),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono)}

.app{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:68px minmax(0,1fr);gap:18px;align-items:start}
/* barra lateral */
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px);max-height:760px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px}
.pill{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px -10px var(--accent)}
.logo img{width:100%;height:100%;display:block;border-radius:inherit}
.nb{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;transition:background .2s,color .2s}
.nb svg{width:21px;height:21px}
.nb:hover{color:var(--ink);background:var(--sub)}
.nb[aria-current="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -6px var(--accent)}
.nb .tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--card-hi);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.nb:hover .tip,.nb:focus-visible .tip{opacity:1}

/* barra superior */
.main{min-width:0;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px}
.theme{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.theme button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.theme button svg{width:18px;height:18px}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search button{flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:8px 14px;cursor:pointer}
.search button:disabled{opacity:.35;cursor:default}
.rt{display:flex;align-items:center;gap:10px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.me{width:46px;height:46px;border-radius:50%;padding:0;border:2px solid var(--line2);overflow:hidden;cursor:pointer;background:var(--card)}
.me img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.9);transform-origin:49% 33%}
.me[aria-expanded="true"]{border-color:var(--accent)}

/* menús desplegables */
.pop{position:absolute;z-index:40;width:min(340px,calc(100vw - 32px));background:var(--card-hi);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);padding:10px;display:grid;gap:4px}
.pop[hidden]{display:none}
.pop h4{margin:6px 8px 2px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.who{display:flex;gap:12px;align-items:center;padding:8px}
.who .ph{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none}
.who .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.9);transform-origin:49% 33%}
.who b{display:block;font-size:16px}
.who span{font-size:13px;color:var(--muted)}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink);text-decoration:none}
.mi:hover{background:var(--sub)}
.mi svg{width:18px;height:18px;color:var(--muted);flex:none}
.mi .grow{flex:1;min-width:0}
.mi small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.st{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.off{background:var(--sub);color:var(--muted)}
.st.warn{background:var(--bad-soft);color:var(--bad)}
.howto{margin:0 10px 6px 40px;font-size:12.5px;color:var(--muted);line-height:1.45}
.sw{width:38px;height:22px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-checked="true"] .sw{background:var(--accent)}
[aria-checked="true"] .sw::after{transform:translateX(16px)}
.nlist{display:grid;gap:4px;max-height:360px;overflow:auto}
.nitem{display:grid;gap:2px;padding:9px 10px;border-radius:12px;background:var(--sub)}
.nitem b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.nitem span{font-size:12px;color:var(--muted)}
.nitem .bad{color:var(--bad)}
.nempty{padding:14px 10px;color:var(--muted);font-size:14px}

/* cuadrícula de widgets */
.grid{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"cal cal asis" "pend pend drive" "pend pend web";align-items:start}
.w{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:16px}
.w-cal{grid-area:cal}.w-asis{grid-area:asis;align-self:stretch}.w-pend{grid-area:pend}.w-drive{grid-area:drive}.w-web{grid-area:web}
.wh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-width:0}
.wh h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
.wh h2 .cnt{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.chipbtn{border:1px solid var(--line2);background:var(--sub);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chipbtn:hover{border-color:var(--accent)}
.dots{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:8px;font-size:18px;line-height:1}

/* calendario */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calnav b{font-size:17px;font-weight:700;text-align:center;flex:1}
.days{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:0}
.dh{display:grid;justify-items:center;gap:2px;padding:6px 0 10px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:12px}
.dh span{font-size:12.5px;font-weight:600}
.dh b{font-size:16px;font-weight:700;color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.dh.today span{color:var(--ink)}
.dh.today b{background:var(--accent);color:var(--accent-ink)}
.dh.sel:not(.today) b{outline:1.5px solid var(--accent)}
.dh i{width:5px;height:5px;border-radius:50%;background:transparent}
.dh i.has{background:var(--accent)}
.allday{grid-column:2/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adl{font-size:10.5px;color:var(--faint);padding:8px 4px 0 0;text-align:right;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adc{display:grid;gap:4px;align-content:start;min-width:0;padding:0 2px}
.tchip{display:block;width:100%;text-align:left;border:0;cursor:default;font-size:11.5px;font-weight:600;line-height:1.25;padding:5px 7px;border-radius:8px;background:var(--sub);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip.urg{background:var(--accent);color:var(--accent-ink)}
.tchip.late{background:var(--bad-soft);color:var(--bad)}
.tchip.more{background:transparent;color:var(--muted);padding:2px 7px}
.hours{grid-column:1/-1;position:relative;display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));height:300px;overflow:auto;scrollbar-width:thin}
.hl{font-size:11px;color:var(--faint);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.hcol{position:relative;border-left:1px dashed var(--line)}
.hrow{height:48px;border-top:1px solid var(--line)}
.ev{position:absolute;left:3px;right:3px;border-radius:10px;padding:6px 8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;overflow:hidden;box-shadow:0 8px 20px -10px var(--accent)}
.ev small{display:block;font-weight:500;opacity:.85}
.ev.alt{background:var(--ink);color:var(--card)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.calempty{grid-column:1/-1;margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card-hi);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.calempty b{color:var(--ink)}
.calempty .chipbtn{margin-left:auto}
.agenda{display:none}
@media (max-width:640px){.calnav .lg{display:none}.calnav .chipbtn{width:38px;height:38px;padding:0;font-size:18px}}
@media (max-width:640px){
  .days{grid-template-columns:repeat(7,minmax(0,1fr))}
  .days .corner,.allday,.adl,.hours{display:none}
  .dh b{width:30px;height:30px;font-size:15px}
  .agenda{display:grid;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
  .agenda .ag{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sub);font-size:14px}
  .agenda .ag time{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;min-width:44px}
  .agenda .ag.urg{background:var(--accent-soft)}
  .agenda .ag.ev time{color:var(--accent)}
  .agenda .agt{min-width:0;overflow-wrap:anywhere}
  .agenda .note{font-size:13px;color:var(--muted);padding:4px 2px}
}

/* asistente (pantalla holográfica) */
.w-asis{background:radial-gradient(110% 70% at 50% 18%,var(--hud-bg2),var(--hud-bg) 65%);border-color:var(--hud-line);color:var(--hud-ink);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.w-asis::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,122,48,.03) 0 1px,transparent 1px 3px)}
.w-asis .wh{margin:0;position:relative;z-index:1}
.w-asis .wh h2{color:var(--hud-ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--hud-dim)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--hud-acc);box-shadow:0 0 8px var(--hud-acc)}
.hudwrap{position:relative;width:min(240px,78%);aspect-ratio:1;margin:0 auto;z-index:1}
